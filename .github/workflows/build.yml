name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AppWatchClone-Android-Kotlin   # <-- nom du sous-dossier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle Wrapper
        run: gradle wrapper
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./AppWatchClone-Android-Kotlin/app/build/outputs/apk/debug/app-debug.apk
